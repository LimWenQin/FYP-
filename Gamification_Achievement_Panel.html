<!DOCTYPE html>
<html>
<head>
<title>Gamification Achievements</title>
<style>
    body 
    {
        background-color: #FFF5E4; /* 背景颜色 */
        margin: 0;  /*与周围的间距*/
        font-family: Arial; /*字体*/
        color: #4A4A4A; /*字体颜色*/
    }

    /* ---------------- HEADER ---------------- */
    .header 
    {
        display: flex; /*变成弹性盒子Flexbox，自动变成一行排列*/
        justify-content: space-between; /*子元素第一个贴左边，最后一个贴右边，中间自动留空*/
        align-items: center; /*将内容上下居中*/
        background-color: #F6B8B8; /* 背景颜色 */
        padding: 20px 50px; /*内容和边框之间的距离*/
        box-shadow: 0 2px 6px rgba(0,0,0,0.1); /*阴影效果*/
    }

    .logo 
    {
        display: flex; /*变成弹性盒子Flexbox，自动变成一行排列*/
        align-items: center; /*将内容上下居中*/
        font-weight: bold; /*粗体*/
        font-size: 36px; /*字体大小*/
        gap: 10px; /* 图片与文字之间的间距 */
    }

    .header .function-links a 
    {
        margin-left: 15px;  /*与周围的间距*/
        text-decoration: none; /*字体的下划线去掉*/
        font-size: 20px; /*字体大小*/
        color: #4A4A4A; /*字体颜色*/
        font-weight: bold; /*粗体*/
    }

    /* ---------------- CONTENT ---------------- */
    .container 
    {
        padding: 30px 50px; /*内容和边框之间的距离*/
    }

    h2 
    {
        color: #F28585; /*字体颜色*/
    }

    /* Points Card */
    .points-box 
    {
        background: white; /* 背景颜色 */
        padding: 25px; /*内容和边框之间的距离*/
        border-radius: 15px; /*设置按钮的圆角*/
        width: 350px; /*设置侧边栏的宽度*/
        box-shadow: 0 2px 6px rgba(0,0,0,0.15); /*阴影效果*/
        margin-bottom: 25px;  /*与周围的间距*/
        text-align: center; /* 字体水平居中对齐 */
    }

    .points-box h3 
    {
        color: #F28585; /*字体颜色*/
        font-size: 22px; /*字体大小*/
    }

    .points-value 
    {
        font-size: 48px; /*字体大小*/
        color: #91C8A8; /*字体颜色*/
        font-weight: bold; /*粗体*/
        margin-top: 10px;  /*与周围的间距*/
    }

    /* Badges Section */
    .badges-container 
    {
        margin-top: 30px;  /*与周围的间距*/
    }

    .badge-grid 
    {
        display: flex; /*变成弹性盒子Flexbox，自动变成一行排列*/
        gap: 20px; /* 图片与文字之间的间距 */
        flex-wrap: wrap;
    }

    .badge 
    {
        background: white; /* 背景颜色 */
        width: 150px;
        border-radius: 12px; /*设置按钮的圆角*/
        padding: 15px; /*内容和边框之间的距离*/
        text-align: center; /* 字体水平居中对齐 */
        box-shadow: 0 2px 6px rgba(0,0,0,0.15); /*阴影效果*/
    }

    .badge img 
    {
        width: 80px; /*设置侧边栏的宽度*/
        height: 80px; /*设置侧边栏的高度*/
        margin-bottom: 10px;  /*与周围的间距*/
    }

    /* Achievement Wall */
    .wall 
    {
        margin-top: 40px;  /*与周围的间距*/
    }

    .wall-grid 
    {
        display: grid; /*把一个容器变成“网格布局（Grid Layout）*/
        grid-template-columns: repeat(3, 1fr); /*把网页分成 3 个平均宽度的格子*/
        gap: 20px; /* 图片与文字之间的间距 */
        margin-top: 20px;  /*与周围的间距*/
    }

    .achievement-card 
    {
        background: white; /* 背景颜色 */
        border-radius: 12px; /*设置按钮的圆角*/
        padding: 15px; /*内容和边框之间的距离*/
        box-shadow: 0 2px 6px rgba(0,0,0,0.15); /*阴影效果*/
        text-align: center; /* 字体水平居中对齐 */
    }

    .achievement-card img 
    {
        width: 100%; /*设置侧边栏的宽度*/
        border-radius: 10px; /*设置按钮的圆角*/
        margin-bottom: 10px;  /*与周围的间距*/
    }

    .social-share 
    {
        margin-top: 10px;  /*与周围的间距*/
        display: flex; /*变成弹性盒子Flexbox，自动变成一行排列*/
        justify-content: center; /*让内容在主轴方向上水平置中（左右居中）*/
        gap: 10px; /* 图片与文字之间的间距 */
    }

    .social-share button 
    {
        background-color: #A8D5BA; /* 背景颜色 */
        border: none; /*按钮的默认边框线*/
        padding: 8px 12px; /*内容和边框之间的距离*/
        border-radius: 8px;  /*设置按钮的圆角*/
        cursor: pointer; /*鼠标变成手指*/
        font-weight: bold; /*粗体*/
    }

    .social-share button:hover 
    {
        background-color: #91C8A8; /* 背景颜色 */
    }

</style>
</head>

<body>

<!-- HEADER (保持你的设计) -->
<header class="header">
    <div class="logo">
        <img src="logo.jpg" alt="Logo" width="80" height="80">
        LOVE BRIDGE
    </div>

    <div class="function-links">
        <a href="#">Home</a>
        <a href="#">About Us</a>
        <a href="#">Contact Us</a>
        <a href="#">Activities</a>
        <a href="#">Track Records</a>
        <a href="#">Achievements</a>
    </div>
</header>

<!-- MAIN CONTENT -->
<div class="container">

    <h2>My Gamification Panel</h2>
    <p>查看您的积分、捐款勋章以及个人成就墙。</p>

    <!-- Donor Points -->
    <div class="points-box">
        <h3>My Points</h3>
        <div class="points-value">320</div>
    </div>

    <!-- Badges Section -->
    <div class="badges-container">
        <h2>My Badges</h2>

        <div class="badge-grid">
            <div class="badge">
                <img src="badge1.png" alt="badge">
                <p>First Donation</p>
            </div>

            <div class="badge">
                <img src="badge2.png" alt="badge">
                <p>RM 500 Donor</p>
            </div>

            <div class="badge">
                <img src="badge3.png" alt="badge">
                <p>Monthly Hero</p>
            </div>
        </div>
    </div>

    <!-- Achievements Wall -->
    <div class="wall">
        <h2>Achievements Wall</h2>
        <p>仅自己可见 · 可分享至社交媒体</p>

        <div class="wall-grid">

            <div class="achievement-card">
                <img src="img1.jpg" alt="achievement">
                <p>帮助孤儿院购买学习用品</p>

                <div class="social-share">
                    <button>WhatsApp</button>
                    <button>Facebook</button>
                    <button>Instagram</button>
                </div>
            </div>

            <div class="achievement-card">
                <img src="img2.jpg" alt="achievement">
                <p>赞助老人院医疗支援</p>

                <div class="social-share">
                    <button>WhatsApp</button>
                    <button>Facebook</button>
                    <button>Instagram</button>
                </div>
            </div>

            <div class="achievement-card">
                <img src="img3.jpg" alt="achievement">
                <p>参与年度慈善义跑</p>

                <div class="social-share">
                    <button>WhatsApp</button>
                    <button>Facebook</button>
                    <button>Instagram</button>
                </div>
            </div>

        </div>
    </div>

</div>

</body>
</html>
